<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Word Smart</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;600&display=swap"
    rel="stylesheet">
  <script>
    try {
      const savedTheme = localStorage.getItem("ws-theme");
      const savedAccent = localStorage.getItem("ws-accent");
      document.documentElement.dataset.theme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.accent = savedAccent === "green" ? "green" : "blue";
    } catch (e) { document.documentElement.dataset.theme = "light"; }
  </script>
  <style>
    :root {
      --bg: #f3f6fa;
      --surf: #fff;
      --ink: #1d2938;
      --mute: #697989;
      --line: #dfe6ef;
      --soft: #eaf0f6;
      --v: #6c5ce7;
      --t: #00a896;
      --rose: #d95c63;
      --amber: #c88721;
      --mint: #38a87f;
      --c: var(--v);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #141b24;
      --surf: #1d2834;
      --ink: #edf4fa;
      --mute: #a3b2c0;
      --line: #354351;
      --soft: #263542;
      --v: #8b7dff;
      --t: #2ad4c0;
      --rose: #ff8187;
      --amber: #f2bf6e;
      --mint: #70d2aa
    }

    :root[data-accent="green"] {
      --bg: #f3f6f3;
      --ink: #1d2b27;
      --mute: #697873;
      --line: #dfe7e2;
      --soft: #eaf1ed;
      --v: #167765;
      --t: #536f9a
    }

    :root[data-theme="dark"][data-accent="green"] {
      --bg: #141b19;
      --surf: #1d2824;
      --ink: #edf4f0;
      --mute: #a0b0a9;
      --line: #35443e;
      --soft: #26342f;
      --v: #70cbb2;
      --t: #9ab8e6;
      --rose: #ff8187;
      --amber: #f2bf6e;
      --mint: #70d2aa
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      background: var(--bg)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 "DM Sans", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center
    }

    body[data-deck="ws2"] {
      --c: var(--t)
    }

    .app {
      width: 100%;
      max-width: 480px;
      padding: 16px 16px 96px
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 2px 0 14px
    }

    h1 {
      font: 800 22px "Bricolage Grotesque", system-ui, sans-serif;
      margin: 0;
      letter-spacing: -.01em
    }

    .chip {
      font-size: 13px;
      font-weight: 600;
      background: var(--surf);
      border: 2px solid var(--line);
      border-radius: 99px;
      padding: 3px 11px
    }

    .seg {
      display: flex;
      gap: 8px
    }

    .pill {
      flex: 1;
      border: 2px solid var(--line);
      background: var(--surf);
      color: var(--ink);
      border-radius: 14px;
      padding: 10px 8px;
      font: 600 15px "DM Sans", system-ui, sans-serif;
      cursor: pointer
    }

    .pill.on {
      border-color: var(--c);
      background: var(--c);
      color: #fff
    }

    .stats {
      display: flex;
      gap: 8px;
      margin: 16px 0 10px
    }

    .stats div {
      flex: 1;
      background: var(--surf);
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 8px 4px;
      text-align: center;
      font-size: 12px;
      color: var(--mute)
    }

    .stats b {
      display: block;
      font: 800 22px "Bricolage Grotesque", system-ui, sans-serif;
      color: var(--c);
      line-height: 1.1
    }

    .stats div:nth-child(2) b {
      color: var(--amber)
    }

    .stats div:nth-child(3) b {
      color: var(--mint)
    }

    .bar,
    .stack {
      height: 8px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden;
      display: flex
    }

    .prog {
      margin: 10px 0
    }

    .pl {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--mute);
      margin-bottom: 4px;
      font-weight: 600
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--c);
      border-radius: 99px;
      transition: width .3s
    }

    .stack i {
      display: block;
      height: 100%
    }

    .card {
      position: relative;
      margin: 16px 0;
      min-height: 250px;
      background: var(--surf);
      border: 2px solid var(--line);
      border-top: 8px solid var(--c);
      border-radius: 22px;
      padding: 34px 22px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      user-select: none
    }

    .word {
      font: 800 38px/1.1 "Bricolage Grotesque", system-ui, sans-serif;
      color: var(--c);
      word-break: break-word
    }

    .def {
      font-size: 19px;
      line-height: 1.45
    }

    .hint {
      font-size: 13px;
      color: var(--mute);
      margin-top: 14px
    }

    .tool {
      position: absolute;
      top: 10px;
      border: 0;
      background: none;
      font-size: 20px;
      color: var(--mute);
      padding: 6px 8px;
      cursor: pointer
    }

    .tool.l {
      left: 6px
    }

    .tool.r {
      right: 6px
    }

    .tool.on {
      color: var(--amber)
    }

    .act {
      display: flex;
      gap: 8px
    }

    .btn {
      flex: 1;
      border: 0;
      border-radius: 14px;
      padding: 13px 6px;
      font: 600 15px "DM Sans", system-ui, sans-serif;
      color: #fff;
      background: var(--c);
      cursor: pointer
    }

    .btn.no {
      background: var(--rose)
    }

    .btn.ok {
      background: var(--mint);
      color: #0d3b2a
    }

    .btn.gh {
      background: var(--surf);
      color: var(--ink);
      border: 2px solid var(--line)
    }

    .btn:disabled {
      opacity: .35
    }

    .opt {
      display: block;
      width: 100%;
      text-align: left;
      margin: 8px 0;
      padding: 13px 14px;
      border-radius: 14px;
      border: 2px solid var(--line);
      background: var(--surf);
      color: var(--ink);
      font: 15px/1.4 "DM Sans", system-ui, sans-serif;
      cursor: pointer
    }

    .opt.ok {
      border-color: var(--mint);
      background: color-mix(in srgb, var(--mint) 20%, var(--surf))
    }

    .opt.bad {
      border-color: var(--rose);
      background: color-mix(in srgb, var(--rose) 16%, var(--surf))
    }

    .q {
      text-align: center;
      margin: 22px 0 10px
    }

    .done {
      text-align: center;
      padding: 34px 8px
    }

    .done p {
      color: var(--mute)
    }

    .sec {
      margin: 22px 0 8px;
      font: 800 16px "Bricolage Grotesque", system-ui, sans-serif
    }

    .box {
      background: var(--surf);
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin: 8px 0
    }

    .box .meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--mute);
      margin-top: 6px
    }

    .week {
      display: flex;
      gap: 6px;
      align-items: flex-end;
      height: 80px
    }

    .week div {
      flex: 1;
      text-align: center;
      font-size: 11px;
      color: var(--mute);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%
    }

    .week i {
      display: block;
      background: var(--c);
      border-radius: 6px 6px 2px 2px;
      min-height: 3px;
      margin-bottom: 3px
    }

    input[type=search],
    textarea,
    select {
      width: 100%;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: var(--surf);
      color: var(--ink);
      padding: 10px;
      font: 15px "DM Sans", system-ui, sans-serif
    }

    textarea {
      min-height: 90px;
      margin: 8px 0
    }

    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin: 10px 0
    }

    .chips button {
      flex: none;
      border: 2px solid var(--line);
      background: var(--surf);
      color: var(--ink);
      border-radius: 99px;
      padding: 5px 13px;
      font: 600 13px "DM Sans", system-ui, sans-serif;
      cursor: pointer
    }

    .chips button.on {
      background: var(--c);
      border-color: var(--c);
      color: #fff
    }

    .wr {
      padding: 11px 4px;
      border-bottom: 1px solid var(--line);
      cursor: pointer
    }

    .wt {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .wt b {
      font-size: 17px
    }

    .wd {
      color: var(--mute);
      font-size: 14px
    }

    .wr.open .wd {
      color: var(--ink)
    }

    .wr .act {
      margin-top: 10px
    }

    .wr .btn {
      padding: 9px 4px;
      font-size: 14px
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--line)
    }

    .dot.learning {
      background: var(--amber)
    }

    .dot.learned {
      background: var(--mint)
    }

    .link {
      background: none;
      border: 0;
      color: var(--c);
      font: 600 14px "DM Sans", system-ui, sans-serif;
      padding: 8px 0;
      cursor: pointer
    }

    .note {
      font-size: 13px;
      color: var(--mute)
    }

    nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--surf);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: center;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      z-index: 5
    }

    nav div {
      display: flex;
      width: 100%;
      max-width: 480px
    }

    nav button {
      flex: 1;
      border: 0;
      background: none;
      color: var(--mute);
      padding: 13px 4px 11px;
      font: 600 14px "DM Sans", system-ui, sans-serif;
      cursor: pointer;
      border-top: 3px solid transparent
    }

    nav button.on {
      color: var(--c);
      border-top-color: var(--c)
    }

    :focus-visible {
      outline: 3px solid var(--c);
      outline-offset: 2px
    }

    :root[data-theme="light"] {
      color-scheme: light;
    }

    html {
      color-scheme: light;
    }

    body {
      background-image: linear-gradient(145deg, color-mix(in srgb, var(--c) 5%, var(--bg)), var(--bg) 46%);
      transition: background-color .2s, color .2s
    }

    .app {
      max-width: 720px;
      padding: 24px 24px 108px;
    }

    header {
      margin: 0 0 24px;
    }

    h1 {
      font-size: 25px;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px 10px;
    }

    .theme-toggle {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surf);
      color: var(--ink);
      font: 20px/1 "DM Sans", sans-serif;
      cursor: pointer;
      transition: background .18s, border-color .18s, transform .18s
    }

    .theme-toggle:hover {
      background: var(--soft);
      border-color: var(--c);
      transform: translateY(-1px);
    }

    .seg {
      gap: 4px;
      padding: 4px;
      border-radius: 13px;
      background: var(--soft);
    }

    .pill {
      border: 0;
      border-radius: 9px;
      padding: 10px 12px;
      background: transparent;
    }

    .pill.on {
      background: var(--surf);
      color: var(--c);
      box-shadow: 0 1px 4px #14251d18;
    }

    .stats {
      gap: 0;
      margin: 24px 0 18px;
      padding: 14px 0;
      border-block: 1px solid var(--line);
    }

    .stats div {
      background: transparent;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      padding: 4px 10px;
    }

    .stats div:last-child {
      border-right: 0;
    }

    .stats b {
      font-size: 25px;
    }

    .stats div:nth-child(2) b {
      color: var(--amber);
    }

    .stats div:nth-child(3) b {
      color: var(--mint);
    }

    .prog {
      margin: 16px 0;
    }

    .bar,
    .stack {
      height: 6px;
    }

    .card {
      min-height: 280px;
      margin: 22px 0 16px;
      border: 1px solid var(--line);
      border-top: 4px solid var(--c);
      border-radius: 17px;
      padding: 38px 26px 30px;
      box-shadow: 0 12px 32px #14251d0a
    }

    .word {
      font-size: 42px;
    }

    .def {
      max-width: 520px;
    }

    .btn {
      border-radius: 10px;
      transition: filter .16s, transform .16s;
    }

    .btn:hover:not(:disabled) {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .btn.ok {
      color: #102d24;
    }

    .btn.gh {
      border: 1px solid var(--line);
    }

    .opt {
      border: 1px solid var(--line);
      border-radius: 10px;
      transition: border-color .16s, background .16s;
    }

    /* No coloured outline/hover on quiz choices (also stops sticky hover on touch) */
    .opt:focus,
    .opt:focus-visible,
    .opt:active {
      outline: none;
    }

    /* Result colours always win, even if the button is hovered/focused */
    .opt.ok,
    .opt.ok:hover,
    .opt.ok:focus,
    .opt.ok:active {
      border-color: var(--mint);
      background: color-mix(in srgb, var(--mint) 20%, var(--surf));
    }

    .opt.bad,
    .opt.bad:hover,
    .opt.bad:focus,
    .opt.bad:active {
      border-color: var(--rose);
      background: color-mix(in srgb, var(--rose) 16%, var(--surf));
    }

    .box {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin: 10px 0;
    }

    .sec {
      margin: 24px 0 8px;
    }

    input[type=search],
    textarea,
    select {
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .chips button {
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .wr {
      padding: 13px 8px;
      transition: background .15s;
    }

    .wr:hover {
      background: color-mix(in srgb, var(--c) 5%, var(--bg));
    }

    nav {
      background: color-mix(in srgb, var(--surf) 94%, transparent);
      backdrop-filter: blur(14px);
    }

    nav div {
      max-width: 720px;
    }

    nav button {
      border-top: 0;
      border-bottom: 2px solid transparent;
      padding: 13px 4px 11px;
    }

    nav button.on {
      border-bottom-color: var(--c);
      border-top-color: transparent;
    }

    @media (max-width: 520px) {
      .app {
        padding: 18px 16px 98px;
      }

      header {
        margin-bottom: 18px;
      }

      .card {
        min-height: 240px;
        padding-inline: 18px;
      }

      .word {
        font-size: 36px;
      }

      .stats div {
        padding-inline: 5px;
        font-size: 11px;
      }

      .stats b {
        font-size: 22px;
      }

      .appearance-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }
    }

    .appearance-box {
      display: grid;
      gap: 14px;
    }

    .appearance-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .appearance-label {
      min-width: 92px;
      font-weight: 600;
    }

    .tint-options,
    .mode-options {
      display: flex;
      gap: 6px;
    }

    .tint-choice,
    .mode-choice {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 6px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surf);
      color: var(--ink);
      font: 600 13px "DM Sans", sans-serif;
      cursor: pointer
    }

    .tint-choice[aria-pressed="true"],
    .mode-choice[aria-pressed="true"] {
      border-color: var(--c);
      background: var(--soft);
      color: var(--c)
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .swatch.blue {
      background: #6c5ce7;
    }

    .swatch.green {
      background: #167765;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f3f6fa" id="theme-color-meta">
  <link rel="icon" href="icon-192.png">
</head>

  </nav>

        if (answered) return; answered = true;
        const ok = opts[+b.dataset.i][0] === cur[0]; rate(cur, ok ? 1 : 0);
        [...document.querySelectorAll(".opt")].forEach((o, i) => { if (opts[i][0] === cur[0]) o.classList.add("ok"); else if (o === b) o.classList.add("bad") });
        document.querySelector('[data-act="next"]').disabled = false; return;
      }
      if (b.classList.contains("wr") && !a) { const w = b.dataset.w; open = open === w ? null : w; fillList(); return }
      const wr = b.closest(".wr"), w = wr ? wr.dataset.w : null;
      if (a === "flip") { flipped = !flipped; render() }
      else if (a === "say") { e.stopPropagation(); say(w || cur[0]) }
      else if (a === "star") { e.stopPropagation(); const p = P()[cur[0]] || (P()[cur[0]] = { b: 0, d: Date.now(), s: 0, f: dk() }); p.s = p.s ? 0 : 1; save(); render() }
      else if (a === "g0" || a === "g1" || a === "g2") { rate(cur, +a[1]); pick(); render() }
      else if (a === "next") { pick(); render() }
      else if (a === "more10") { S.more[dk()] = (S.more[dk()] || 0) + 10; save(); cur = null; pick(); render() }
      else if (a === "older") { S.older[dk()] = 1; save(); cur = null; pick(); render() }
      else if (a === "bknow") { backup("manual", 1) }
      else if (a === "bkfile") { linkFile() }
      else if (a === "bkresume") { resumeFile() }
      else if (a === "bkrestore") { restoreSnap(+b.dataset.ts) }
      else if (a === "showmore") { wshow += 60; fillList() }
      else if (a === "wstar") { const p = P()[w] || (P()[w] = { b: 0, d: Date.now(), s: 0, f: dk() }); p.s = p.s ? 0 : 1; save(); fillList() }
      else if (a === "wlearn") { const p = P()[w] || (P()[w] = { b: 0, d: Date.now(), s: 0, f: dk() }); p.b = 5; p.d = Date.now() + INT[5]; save(); fillList() }
      else if (a === "wreset") { const p = P()[w]; if (p) { p.b = 0; p.d = Date.now() } save(); fillList() }
      else if (a === "export") {
        backupVisible = !backupVisible;
        render();
        if (backupVisible) {
          const t = JSON.stringify(S); $("bk").value = t;
          try { navigator.clipboard.writeText(t); msg("Backup shown and copied.") } catch (x) { msg("Backup shown. Select and copy it.") }
        }
      }
      else if (a === "import") {
        if (!backupVisible) { backupVisible = true; render(); $("bk").focus(); msg("Paste a backup here, then select Restore."); return }
        try { const o = JSON.parse($("bk").value); if (!o.p || !o.extra) throw 0; backup("before restore"); applyState(o); msg("Progress restored.") }
        catch (x) { msg("That text is not a valid backup.") }
      }
      else if (a === "reset") {
        if (!confirmReset) { confirmReset = true; render() }
        else { S.p[S.deck] = {}; confirmReset = false; save(); cur = null; pick(); render(); msg("Progress reset.") }
      }
    };
    document.addEventListener("keydown", e => {
      if (S.tab === "study" && cur && e.key === " " && e.target === document.body) { e.preventDefault(); flipped = !flipped; render() }
    });
    /* ===== Auto backup ===== */
    const BK = { snaps: [], last: 0, fh: null, perm: false, fileTs: 0, busy: false };
    const idb = () => BK.dbp || (BK.dbp = new Promise((res, rej) => { const r = indexedDB.open("wsbk", 1); r.onupgradeneeded = () => { r.result.createObjectStore("snaps", { keyPath: "ts" }); r.result.createObjectStore("kv") }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error) }));
    const tx = (st, mode, fn) => idb().then(db => new Promise((res, rej) => { const t = db.transaction(st, mode), r = fn(t.objectStore(st)); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error) }));
    let durableQueue = Promise.resolve();
    durableSave = data => {
      durableQueue = durableQueue.catch(() => { }).then(() => tx("kv", "readwrite", s => s.put({ ts: Date.now(), data }, "state"))).catch(() => { });
      return durableQueue;
    };
    const hasData = o => o && o.p && (Object.keys(o.p.ws1 || {}).length || Object.keys(o.p.ws2 || {}).length || (o.extra && (o.extra.ws1.length || o.extra.ws2.length)));
    function applyState(o) {
      const keep = S.tab;
      S = Object.assign({ deck: "ws1", tab: keep, goal: 100, gv: 2, more: {}, older: {}, auto: true, extra: { ws1: [], ws2: [] }, p: { ws1: {}, ws2: {} }, log: {} }, o);
      S.tab = keep; mig(); save(); cur = null; pick(); render();
    }
    const fmt = t => new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    async function loadSnaps() { try { BK.snaps = (await tx("snaps", "readonly", s => s.getAll())).sort((a, b) => b.ts - a.ts) } catch (e) { BK.snaps = [] } }
    async function backup(why, loud) {
      if (BK.busy) return; BK.busy = true;
      try {
        const data = JSON.stringify(S);
        await loadSnaps();
        if (hasData(S) && (!BK.snaps[0] || BK.snaps[0].data !== data)) {
          await tx("snaps", "readwrite", s => s.put({ ts: Date.now(), why, data }));
          for (const o of BK.snaps.slice(29)) await tx("snaps", "readwrite", s => s.delete(o.ts));
          await loadSnaps();
        }
        BK.last = Date.now(); await tx("kv", "readwrite", s => s.put(BK.last, "last"));
        await fileWrite(data);
        if (loud) msg("Backed up.");
      } catch (e) { if (loud) msg("Backup failed: this browser blocked storage.") }
      BK.busy = false; bkUI();
    }
    async function fileWrite(data) {
      if (!BK.fh || !BK.perm) return;
      try { const w = await BK.fh.createWritable(); await w.write(data); await w.close(); BK.fileTs = Date.now() } catch (e) { BK.perm = false }
    }
    async function linkFile() {
      try {
        BK.fh = await showSaveFilePicker({ suggestedName: "wordsmart-backup.json", types: [{ description: "Word Smart backup", accept: { "application/json": [".json"] } }] });
        BK.perm = true; await tx("kv", "readwrite", s => s.put(BK.fh, "fh")); await fileWrite(JSON.stringify(S));
      } catch (e) { }
      bkUI();
    }
    async function resumeFile() { try { BK.perm = (await BK.fh.requestPermission({ mode: "readwrite" })) === "granted"; if (BK.perm) await fileWrite(JSON.stringify(S)) } catch (e) { } bkUI() }
    async function restoreSnap(ts) {
      const o = BK.snaps.find(x => x.ts === ts); if (!o) return;
      if (!confirm("Restore the backup from " + fmt(ts) + "? Your current progress is saved as a backup first.")) return;
      await backup("before restore");
      try { applyState(JSON.parse(o.data)); msg("Restored backup from " + fmt(ts) + ".") } catch (e) { msg("That backup could not be read.") }
    }
    function bkUI() {
      const b = $("bkbox"); if (!b) return;
      const canFile = typeof window.showSaveFilePicker === "function";
      let h = `<p class="note" style="margin:8px 0">${BK.last ? "Last backup: " + fmt(BK.last) + ". " : "No backup yet. "}${BK.snaps.length} saved cop${BK.snaps.length === 1 ? "y" : "ies"} kept on this device.</p><div class="act"><button class="btn gh" data-act="bknow">Back up now</button>${canFile && !BK.fh ? `<button class="btn gh" data-act="bkfile">Also save to a file</button>` : ""}${BK.fh && !BK.perm ? `<button class="btn gh" data-act="bkresume">Resume file backup</button>` : ""}</div>`;
      if (BK.fh && BK.perm) h += `<p class="note" style="margin:8px 0">File backup is on${BK.fileTs ? " (last written " + fmt(BK.fileTs) + ")" : ""}.</p>`;
      if (BK.snaps.length) h += `<div style="margin-top:8px">` + BK.snaps.slice(0, 6).map(o => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px"><span>${fmt(o.ts)} <span class="note">· ${esc(o.why)}</span></span><button class="btn gh" style="padding:6px 12px;min-height:0" data-act="bkrestore" data-ts="${o.ts}">Restore</button></div>`).join("") + `</div>`;
      b.innerHTML = h;
    }
    async function bkInit() {
      try {
        BK.last = (await tx("kv", "readonly", s => s.get("last"))) || 0;
        BK.fh = (await tx("kv", "readonly", s => s.get("fh"))) || null;
        if (BK.fh) { try { BK.perm = (await BK.fh.queryPermission({ mode: "readwrite" })) === "granted" } catch (e) { } }
        await loadSnaps();
        if (!hadLS && !hasData(S)) {
          let restored = false;
          const latest = await tx("kv", "readonly", s => s.get("state"));
          if (latest && latest.data) {
            try { const o = JSON.parse(latest.data); if (o.p && o.extra) { applyState(o); msg("Your progress was restored from local recovery storage."); restored = true } } catch (e) { }
          }
          if (!restored) {
            const o = BK.snaps.find(x => { try { return hasData(JSON.parse(x.data)) } catch (e) { return 0 } });
            if (o) { applyState(JSON.parse(o.data)); msg("Your progress was restored from the latest automatic backup.") }
          }
        }
        try { navigator.storage && navigator.storage.persist && navigator.storage.persist() } catch (e) { }
        await durableSave(JSON.stringify(S));
      } catch (e) { }
      if (S.auto) await backup("app opened"); else bkUI();
      setInterval(() => { if (S.auto) backup("every 5 min") }, 5 * MIN);
      document.addEventListener("visibilitychange", () => {
        if (!S.auto) return;
        if (document.hidden) backup("app closed");
        else if (Date.now() - BK.last > 5 * MIN) backup("app opened");
      });
      addEventListener("pagehide", () => { if (S.auto) backup("app closed") });
    }
    pick(); render();
    bkInit();
  </script>
  <script>if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function () { });</script>
